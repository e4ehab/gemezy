<svg viewBox="0 0 600 650" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1b2a33"/>
      <stop offset="55%" stop-color="#0e161c"/>
      <stop offset="100%" stop-color="#04070a"/>
    </radialGradient>

    <linearGradient id="heartRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c21f2e"/>
      <stop offset="45%" stop-color="#8f0f1c"/>
      <stop offset="100%" stop-color="#4a060d"/>
    </linearGradient>

    <linearGradient id="heartRedBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9c1521"/>
      <stop offset="50%" stop-color="#6e0d15"/>
      <stop offset="100%" stop-color="#38050a"/>
    </linearGradient>

    <linearGradient id="horn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c2f"/>
      <stop offset="50%" stop-color="#111113"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <filter id="fogblur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Keep the mark transparent so the auth surface controls its contrast. -->
  <g transform="translate(-45 -45) scale(1.15)">

  <!-- back heart (right, slightly behind) -->
  <g transform="translate(330,330)">
    <path d="M0,90
             C-90,20 -150,-40 -150,-110
             C-150,-165 -105,-195 -60,-195
             C-25,-195 -5,-175 0,-150
             C5,-175 25,-195 60,-195
             C105,-195 150,-165 150,-110
             C150,-40 90,20 0,90 Z"
          fill="url(#heartRedBack)" stroke="#050505" stroke-width="10"/>
    <!-- simple filigree accents -->
    <g stroke="#0c0c0d" stroke-width="4" fill="none" opacity="0.85">
      <path d="M-40,-150 C-10,-160 10,-140 5,-110 C0,-85 30,-80 35,-100"/>
      <circle cx="45" cy="-95" r="7"/>
      <path d="M-30,-40 C0,-55 40,-45 55,-15 C65,10 40,25 55,40"/>
      <circle cx="58" cy="45" r="6"/>
      <path d="M-70,10 C-40,0 -10,20 0,45"/>
    </g>
  </g>

  <!-- front heart (left) -->
  <g transform="translate(275,330)">
    <path d="M0,105
             C-105,25 -175,-45 -175,-125
             C-175,-190 -122,-225 -70,-225
             C-30,-225 -6,-200 0,-172
             C6,-200 30,-225 70,-225
             C122,-225 175,-190 175,-125
             C175,-45 105,25 0,105 Z"
          fill="url(#heartRed)" stroke="#050505" stroke-width="12"/>

    <!-- ornate vine filigree -->
    <g stroke="#0a0a0b" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.95">
      <path d="M0,-172 C0,-140 -20,-120 -55,-115 C-90,-110 -95,-80 -70,-65"/>
      <path d="M-70,-65 C-45,-50 -50,-20 -80,-10 C-105,-2 -100,25 -70,30"/>
      <path d="M-70,30 C-45,35 -35,60 -55,80 C-70,95 -55,115 -30,110"/>
      <path d="M0,-172 C-10,-150 -40,-145 -60,-160"/>
      <path d="M-55,-115 C-75,-125 -100,-115 -105,-95"/>
      <path d="M-80,-10 C-105,-15 -125,0 -120,20"/>
      <path d="M-55,80 C-80,75 -95,90 -85,110"/>
      <circle cx="-105" cy="-95" r="8"/>
      <circle cx="-120" cy="20" r="8"/>
      <circle cx="-85" cy="110" r="8"/>
      <circle cx="-60" cy="-160" r="7"/>
      <path d="M20,-160 C40,-140 40,-115 15,-100"/>
      <circle cx="10" cy="-95" r="6"/>
    </g>
  </g>

  <!-- twisted horns / tendrils joining hearts -->
  <g fill="url(#horn)" stroke="#000" stroke-width="2">
    <path d="M270,140
             C255,90 275,55 300,45
             C315,40 320,55 310,65
             C295,80 300,100 315,105
             C335,112 340,140 320,155
             C305,167 280,165 270,140 Z"/>
    <path d="M330,140
             C345,90 325,55 300,45
             C285,40 280,55 290,65
             C305,80 300,100 285,105
             C265,112 260,140 280,155
             C295,167 320,165 330,140 Z"/>
  </g>

  </g>
</svg>
